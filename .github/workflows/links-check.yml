name: Links Check (Reusable)

on:
  workflow_call:
    inputs:
      targets:
        description: Space-separated markdown/HTML targets or directories for lychee.
        required: false
        type: string
        default: 'README.md'
      extra-args:
        description: Additional flags passed to lychee.
        required: false
        type: string
        default: ''

jobs:
  links:
    name: Check links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --exclude 'linkedin\.com'
            --exclude 'mailto:'
            ${{ inputs.extra-args }}
            ${{ inputs.targets }}
          fail: true
          failIfEmpty: false
