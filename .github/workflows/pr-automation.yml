name: PR Automation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: pr-automation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/pr-queue-rebase.yml
    with:
      mode: auto-merge
    secrets:
      token: ${{ secrets.PR_QUEUE_TOKEN }}

  rebase-next:
    if: github.event_name == 'push'
    uses: ./.github/workflows/pr-queue-rebase.yml
    with:
      mode: rebase-next
    secrets:
      token: ${{ secrets.PR_QUEUE_TOKEN }}
